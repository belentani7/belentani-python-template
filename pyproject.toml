[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "{{cookiecutter.project_slug}}"
version = "0.1.0"
description = "{{cookiecutter.description}}"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.29",
    "redis>=5.2",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.28",
    "structlog>=24.1",
    "python-json-logger>=2.0",
]
optional-dependencies = {
    "dev" = [
        "pytest>=8.3",
        "pytest-cov>=6.0",
        "pytest-asyncio>=0.23",
        "pytest-mock>=3.14",
        "ruff>=0.8",
        "mypy>=1.11",
        "black>=24.10",
        "pre-commit>=3.8",
        "faker>=33.1",
        "factory-boy>=3.3",
    ],
    "api" = ["uvicorn[standard]>=0.30"],
    "celery" = ["celery>=5.4", "redis>=5.2"],
    "sentry" = ["sentry-sdk[fastapi]>=2.1"],
    "otel" = ["opentelemetry-instrumentation-fastapi>=0.47", "opentelemetry-exporter-otlp>=1.27"],
}

[project.urls]
Homepage = "https://github.com/belentani7/{{cookiecutter.project_slug}}"
Repository = "https://github.com/belentani7/{{cookiecutter.project_slug}}"
Issues = "https://github.com/belentani7/{{cookiecutter.project_slug}}/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config -ra -q --cov=src --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: fast isolated tests",
    "integration: requires external services",
    "e2e: full stack tests",
    "slow: >1s",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "W", "C90", "UP", "B", "A", "C4", "DTZ", "T20", "PYI", "PT", "Q", "RUF", "SIM", "TRY", "ARG", "PTH", "ERA", "PD", "PL", "RET", "TCH", "INT", "PERF", "FURB", "LOG"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = ["T20", "ARG001", "ARG002"]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
enable_error_code = ["ignore-without-code"]

[tool.black]
line-length = 100
target-version = ["py312"]
preview = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/migrations/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "raise AssertionError",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["{{cookiecutter.project_slug}}*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "mypy>=1.11",
    "black>=24.10",
    "pre-commit>=3.8",
    "faker>=33.1",
    "factory-boy>=3.3",
]